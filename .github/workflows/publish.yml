name: Sync & Publish Chrome Extensions

on:
  schedule:
    - cron: 0 15 * * *
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  check-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Dependencies
        run: |
          npm install -g chrome-webstore-upload-cli
          sudo apt-get install -y jq zip curl
          mkdir -p .sync-status

      # ========================================
      # Tree-Style-History
      # ========================================
      - name: Process Tree-Style-History
        env:
          EXT_NAME: 'Tree Style History'
          UPSTREAM_URL: 'https://github.com/tumuyan/Tree-Style-History'
          STORE_URL: 'https://chromewebstore.google.com/detail/khcenbpnhbeplojhaolbpldmoppicold'
          ROW_FILE: '.sync-status/01-ext1.md'
          UPSTREAM_REPO: 'https://github.com/tumuyan/Tree-Style-History.git'
          EXT_ID: ${{ secrets.EXT1_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: |
          write_row() {
            echo "| [$EXT_NAME]($STORE_URL) | \`${UPSTREAM_VER:-未知}\` | \`${PUBLISHED_VER:-未知}\` | \`${DRAFT_VER:-未知}\` | $1 |" > "$ROW_FILE"
          }

          echo "==== 克隆上游仓库 ===="
          git clone $UPSTREAM_REPO target-ext1
          UPSTREAM_VER=$(jq -r '.version' target-ext1/chrome/manifest.json)
          echo "Upstream version: $UPSTREAM_VER"

          echo "==== 获取 Google API Access Token ===="
          ACCESS_TOKEN=$(curl -s -X POST \
            -d "client_id=$CLIENT_ID" \
            -d "client_secret=$CLIENT_SECRET" \
            -d "refresh_token=$REFRESH_TOKEN" \
            -d "grant_type=refresh_token" \
            https://oauth2.googleapis.com/token | jq -r .access_token)

          if [ "$ACCESS_TOKEN" == "null" ] || [ -z "$ACCESS_TOKEN" ]; then
            echo "Error: 无法获取 Access Token，请检查变量是否正确配置。"
            write_row "❌ 获取 Token 失败"
            exit 1
          fi

          echo "==== 获取商店当前审核中/已提交的版本 ===="
          ITEM_INFO=$(curl -s -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "x-goog-api-version: 2" \
            "https://www.googleapis.com/chromewebstore/v1.1/items/$EXT_ID?projection=DRAFT")
          DRAFT_VER=$(echo "$ITEM_INFO" | jq -r '.crxVersion // "none"')
          echo "Draft version in Chrome Store: $DRAFT_VER"

          echo "==== 获取商店已发布的版本 ===="
          PUBLISHED_VER=$(curl -sL -H "Accept-Language: en-US,en;q=0.9" \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
            "https://chromewebstore.google.com/detail/$EXT_ID" \
            | grep -oE '>Version</div><div class="[^"]*">[0-9][0-9.]*<' \
            | grep -oE '[0-9][0-9.]*' | head -1)
          PUBLISHED_VER=${PUBLISHED_VER:-none}
          echo "Published version in Chrome Store: $PUBLISHED_VER"

          echo "==== 对比版本 ===="
          if [ "$UPSTREAM_VER" == "$PUBLISHED_VER" ]; then
            echo "版本 $UPSTREAM_VER 已发布，跳过推送。"
            write_row "✅ 已发布最新版"
          elif [ "$UPSTREAM_VER" == "$DRAFT_VER" ]; then
            echo "版本 $UPSTREAM_VER 已提交，正在审核中，跳过推送。"
            write_row "🕑 审核中"
          else
            echo "检测到新版本 $UPSTREAM_VER，准备打包上传..."

            cd target-ext1/chrome
            jq 'del(.update_url)' manifest.json > tmp.json && mv tmp.json manifest.json
            echo "==== 已清除 manifest.json 中的 update_url 字段 ===="
            zip -rq ../../ext1.zip .
            cd ../..

            # 上传并自动发布
            if chrome-webstore-upload upload \
              --source ext1.zip \
              --extension-id $EXT_ID \
              --auto-publish; then
              write_row "🚀 本次已提交审核"

              echo "==== 发送通知 ===="
              if [[ $SENDKEY =~ ^sctp([0-9]+)t ]]; then
                UID_VAL="${BASH_REMATCH[1]}"
                curl -X POST "https://${UID_VAL}.push.ft07.com/send/${SENDKEY}.send" \
                     -d "title=Tree-Style-History已提交: v$UPSTREAM_VER" \
                     -d "desp=Tree-Style-History (v$UPSTREAM_VER) 已成功推送到 Chrome Web Store，目前处于排队审核状态。"
              else
                echo "Warning: SendKey 格式不匹配 sctp{uid}t，无法发送 Server酱 通知。"
              fi
            else
              write_row "❌ 提交失败"
              exit 1
            fi
          fi

      # ========================================
      # TabulaBili
      # ========================================
      - name: Process TabulaBili
        if: ${{ !cancelled() }}
        env:
          EXT_NAME: 'TabulaBili (初见哔哩)'
          UPSTREAM_URL: 'https://github.com/wangdaodaodao/TabulaBili'
          STORE_URL: 'https://chromewebstore.google.com/detail/hjknablinpkpajdhjboogodgkpggffog'
          ROW_FILE: '.sync-status/02-ext2.md'
          UPSTREAM_REPO: 'https://github.com/wangdaodaodao/TabulaBili.git'
          EXT_ID: ${{ secrets.EXT2_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: |
          write_row() {
            echo "| [$EXT_NAME]($STORE_URL) | \`${UPSTREAM_VER:-未知}\` | \`${PUBLISHED_VER:-未知}\` | \`${DRAFT_VER:-未知}\` | $1 |" > "$ROW_FILE"
          }

          echo "==== 克隆上游仓库 ===="
          git clone $UPSTREAM_REPO target-ext2
          UPSTREAM_VER=$(jq -r '.version' target-ext2/manifest.json)
          echo "Upstream version: $UPSTREAM_VER"

          ACCESS_TOKEN=$(curl -s -X POST \
            -d "client_id=$CLIENT_ID" \
            -d "client_secret=$CLIENT_SECRET" \
            -d "refresh_token=$REFRESH_TOKEN" \
            -d "grant_type=refresh_token" \
            https://oauth2.googleapis.com/token | jq -r .access_token)

          if [ "$ACCESS_TOKEN" == "null" ] || [ -z "$ACCESS_TOKEN" ]; then
            echo "Error: 无法获取 Access Token，请检查变量是否正确配置。"
            write_row "❌ 获取 Token 失败"
            exit 1
          fi

          echo "==== 获取商店当前审核中/已提交的版本 ===="
          ITEM_INFO=$(curl -s -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "x-goog-api-version: 2" \
            "https://www.googleapis.com/chromewebstore/v1.1/items/$EXT_ID?projection=DRAFT")
          DRAFT_VER=$(echo "$ITEM_INFO" | jq -r '.crxVersion // "none"')
          echo "Draft version in Chrome Store: $DRAFT_VER"

          echo "==== 获取商店已发布的版本 ===="
          PUBLISHED_VER=$(curl -sL -H "Accept-Language: en-US,en;q=0.9" \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
            "https://chromewebstore.google.com/detail/$EXT_ID" \
            | grep -oE '>Version</div><div class="[^"]*">[0-9][0-9.]*<' \
            | grep -oE '[0-9][0-9.]*' | head -1)
          PUBLISHED_VER=${PUBLISHED_VER:-none}
          echo "Published version in Chrome Store: $PUBLISHED_VER"

          if [ "$UPSTREAM_VER" == "$PUBLISHED_VER" ]; then
            echo "版本 $UPSTREAM_VER 已发布，跳过推送。"
            write_row "✅ 已发布最新版"
          elif [ "$UPSTREAM_VER" == "$DRAFT_VER" ]; then
            echo "版本 $UPSTREAM_VER 已提交，正在审核中，跳过推送。"
            write_row "🕑 审核中"
          else
            echo "检测到新版本 $UPSTREAM_VER，准备打包上传..."

            cd target-ext2
            zip -rq ../ext2.zip . -x "*.git*" ".gitignore" "README.md" "README_zh.md"
            cd ..

            # 上传并自动发布
            if chrome-webstore-upload upload \
              --source ext2.zip \
              --extension-id $EXT_ID \
              --auto-publish; then
              write_row "🚀 本次已提交审核"

              echo "==== 发送通知 ===="
              if [[ $SENDKEY =~ ^sctp([0-9]+)t ]]; then
                UID_VAL="${BASH_REMATCH[1]}"
                curl -X POST "https://${UID_VAL}.push.ft07.com/send/${SENDKEY}.send" \
                     -d "title=TabulaBili已提交: v$UPSTREAM_VER" \
                     -d "desp=TabulaBili (v$UPSTREAM_VER) 已成功推送到 Chrome Web Store，目前处于排队审核状态。"
              else
                echo "Warning: SendKey 格式不匹配 sctp{uid}t，无法发送 Server酱 通知。"
              fi
            else
              write_row "❌ 提交失败"
              exit 1
            fi
          fi

      # ========================================
      # 将同步状态写回 README.md
      # ========================================
      - name: Update README Sync Status
        if: ${{ !cancelled() }}
        run: |
          echo "==== 生成状态区块 ===="
          {
            echo '<!-- SYNC_STATUS_START -->'
            echo "> 🕐 最后检查时间：$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M') (UTC+8)"
            echo ''
            echo '| 扩展名称 | 上游版本 | 商店已发布版本 | 商店提交版本 | 状态 |'
            echo '| :--- | :--- | :--- | :--- | :--- |'
            cat .sync-status/*.md 2>/dev/null || echo '| - | - | - | - | 暂无数据 |'
            echo '<!-- SYNC_STATUS_END -->'
          } > /tmp/status_block.md

          # README 中若无标记区块则自动追加一个
          if ! grep -q 'SYNC_STATUS_START' README.md; then
            printf '\n## 📊 同步状态\n\n<!-- SYNC_STATUS_START -->\n<!-- SYNC_STATUS_END -->\n' >> README.md
          fi

          echo "==== 替换 README 标记区块 ===="
          awk '
            /<!-- SYNC_STATUS_START -->/ {
              while ((getline line < "/tmp/status_block.md") > 0) print line
              skip = 1; next
            }
            /<!-- SYNC_STATUS_END -->/ { skip = 0; next }
            !skip { print }
          ' README.md > /tmp/README.new && mv /tmp/README.new README.md

          echo "==== 提交变更（忽略仅时间戳变化）===="
          if git diff -I '最后检查时间' --quiet README.md; then
            echo "版本状态无实质变化，跳过提交。"
            git checkout -- README.md
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: 更新扩展同步状态 [skip ci]"
            git push
          fi

      # ========================================
      # Clear
      # ========================================
      - name: Remove old workflow runs
        uses: ophub/delete-releases-workflows@main
        with:
          delete_workflows: true
          workflows_keep_day: 3
          gh_token: ${{ secrets.GITHUB_TOKEN }}
